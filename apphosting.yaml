# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0

# SvelteKit adapter-node produces a standalone Node server in the build/ directory.
build:
  output:
    directory: build

